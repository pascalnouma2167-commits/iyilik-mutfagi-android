plugins {
    id 'com.android.application'
}

def keystorePath = System.getenv("KEYSTORE_FILE")

android {
    namespace 'com.iyilikmutfagi.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.iyilikmutfagi.app"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}

dependencies {
}
